<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ember">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4a39" />
      <stop offset="1" stop-color="#143125" />
    </linearGradient>
    <linearGradient id="wrapper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf9760" />
      <stop offset="0.55" stop-color="#b07b4a" />
      <stop offset="1" stop-color="#7d5231" />
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb45e" />
      <stop offset="0.35" stop-color="#e2622f" />
      <stop offset="1" stop-color="#7a4030" />
    </linearGradient>
    <radialGradient id="smoke" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="cigar">
      <rect x="138" y="222" width="236" height="68" rx="34" />
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <circle cx="123" cy="290" r="52" fill="url(#smoke)" opacity="0.5" />
  <circle cx="91" cy="243" r="40" fill="url(#smoke)" opacity="0.35" />
  <circle cx="63" cy="198" r="30" fill="url(#smoke)" opacity="0.22" />

  <g transform="rotate(-45 256 256)">
    <g clip-path="url(#cigar)">
      <rect x="138" y="222" width="236" height="68" fill="url(#wrapper)" />
      <rect x="138" y="222" width="58" height="68" fill="url(#ember)" />
      <rect x="196" y="222" width="14" height="68" fill="#4a2a1d" opacity="0.85" />
      <rect x="246" y="222" width="20" height="68" fill="#f4d9a2" />
      <rect x="348" y="222" width="26" height="68" fill="#8a5a34" opacity="0.7" />
      <ellipse cx="152" cy="256" rx="12" ry="12" fill="#ffe9cd" opacity="0.75" />
    </g>
    <rect
      x="138"
      y="222"
      width="236"
      height="68"
      rx="34"
      fill="none"
      stroke="#3f2517"
      stroke-opacity="0.45"
      stroke-width="3"
    />
